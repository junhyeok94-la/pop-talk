if ($programname == "pop-talk-scheduler") then {
    action(
        type="omfile"
        file="/var/log/pop-talk/scheduler.log"
        createDirs="on"
        dirCreateMode="0750"
        fileCreateMode="0640"
    )
    stop
}

if ($programname == "pop-talk-embedding") then {
    action(
        type="omfile"
        file="/var/log/pop-talk/embedding.log"
        createDirs="on"
        dirCreateMode="0750"
        fileCreateMode="0640"
    )
    stop
}

