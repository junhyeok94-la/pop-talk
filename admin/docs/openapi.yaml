openapi: 3.1.0

info:
  title: 팝콘톡 Admin API
  version: 0.1.0
  license:
    name: Proprietary
  description: |
    팝콘톡 관리자 콘솔이 쓰는 API입니다.
    화면 10개가 실제로 호출하는 것만 담았고, 화면에 없는 기능은 넣지 않았습니다.

    ## 작성 근거

    - **영화 도메인**은 실제 DB(`dev` 스키마)의 컬럼명·타입을 그대로 씁니다.
      화면에서 이름을 바꾸면 매핑 층이 하나 더 생기므로 그러지 않았습니다.
    - **회원 도메인**은 아직 테이블이 없습니다. `docs/user-domain-draft.sql`의
      초안을 전제로 작성했으므로, 스키마가 확정되면 함께 조정해야 합니다.
    - 조회 응답은 `dev.popcorn_movies_service` 뷰를 그대로 내려주는 형태입니다.
      이 뷰가 `is_embedded`와 `media`를 미리 붙여줍니다.

    ## 규약

    | 항목 | 규칙 |
    |---|---|
    | 목록 | `page`(1부터) · `size`(기본 10) · 응답에 `page`·`size`·`total`·`total_pages` |
    | 날짜 | 날짜는 `YYYY-MM-DD`, 시각은 `YYYY-MM-DD HH:mm:ss` (KST) |
    | 기간 필터 | `*_from` · `*_to`, 양끝 포함. 한쪽만 주면 그쪽만 제한 |
    | 정렬 | `sort=필드:asc|desc`. 기본값은 엔드포인트마다 명시 |
    | 부분 수정 | `PATCH` + 바꿀 필드만. 빈 객체는 400 |
    | 오류 | RFC 9457 `application/problem+json` |

    ## 인증

    > **이번 범위에서 관리자 로그인은 만들지 않기로 했습니다.**
    > `/auth/*` 세 개는 목표 설계로 남겨둔 것이며 이번 구현 대상이 아닙니다.
    > 그동안 API를 무엇으로 보호할지, 감사 기록의 "누가"를 무엇으로 채울지는
    > 아래 *로그인 없이 가는 동안* 을 보세요.

    `/auth/login`·`/auth/refresh`를 제외한 모든 요청에
    `Authorization: Bearer <JWT>`가 필요합니다.
    토큰에는 관리자 `id`와 `role`이 들어갑니다. 감사 로그의 "누가"는 서버가
    토큰에서 읽어 채웁니다 — 클라이언트가 보내는 값을 믿지 않습니다.

    | | |
    |---|---|
    | 액세스 토큰 | 15분. 응답 본문으로 내려주고 **메모리에만** 보관 |
    | 리프레시 토큰 | 14일. `httpOnly` · `Secure` · `SameSite=Strict` 쿠키, 갱신 시 회전 |

    액세스 토큰을 `localStorage`에 넣으면 XSS 한 번에 털립니다.

    > **이 인증 설계는 제안이지 결정이 아닙니다.** 흔한 형태로 초안을 잡은 것이라,
    > 팀이 SSO를 쓰거나 만료 정책이 다르면 그대로 바꾸면 됩니다.

    ## 회원과 관리자는 한 테이블입니다

    > **2026-08-11 정정** — 아래는 실제 DB를 확인해 고친 내용입니다.
    > 8/9에는 "`users` 하나에 `role`로 가른다"고 적었으나, 담당자가 만든 실제
    > `dev.users`에는 **`role` 컬럼이 없고** `members_service` 뷰도 없습니다.
    > 관리자 테이블도 아직 없습니다.

    | 화면 | 읽을 것 | 상태 |
    |---|---|---|
    | 서비스 영화 · 인증완료 · 영화 상세 | `dev.popcorn_movies_service` | ✅ 5,309편 |
    | 회원 관리 · 회원 상세 | `dev.users` | 테이블은 있으나 0행 |
    | 감상평 | `dev.reviews` | 테이블은 있으나 0행 |
    | 관리자 관리 · GNB 계정 | **아직 없음** | 테이블 신설 필요 |

    **`role` 필터는 필요 없습니다.** `dev.users`는 앱 사용자 전용입니다
    (`onboarding_status`·`profile_image_url` 같은 컬럼이 그 근거입니다).
    관리자는 별도 테이블로 갈 예정이라 섞일 일이 없습니다.

    **영화는 `popcorn_movies`(bigint)를 봅니다.** `dev.movies`(uuid)라는 테이블이
    따로 있고 감상평·찜·시청기록은 그쪽을 참조하지만, 지금 0편이고 admin이 검수하는
    대상은 수집 계층입니다. 두 계층을 잇는 단계는 아직 정리되지 않았습니다.

    ## 로그인 없이 가는 동안

    로그인을 만들지 않으면 토큰이 없고, 토큰이 없으면 두 가지가 비어 버립니다.

    | 비는 것 | 왜 |
    |---|---|
    | API 보호 | 모든 엔드포인트가 `Bearer` 토큰을 전제로 합니다 |
    | 감사 주체 | `approved_by`·`status_updated_by`를 토큰에서 읽기로 했습니다 |

    두 번째가 특히 문제입니다. **검증 로그 화면이 "누가 인증했는지"를 보여주는데
    그 값의 출처가 사라집니다.** 실 DB의 5,985편도 지금은 `approved_by`가
    전부 `initial-dataset`입니다.

    임시 방안은 팀이 정할 사항이라 명세에는 넣지 않았습니다.
    다만 정해지기 전까지는 이 두 자리가 비어 있다는 점을 기억하세요.

    ## 목 서버로 먼저 붙이기

    이 명세만으로 목 서버가 뜹니다. 백엔드 구현 전에 화면 개발을 시작할 수 있습니다.

    ```
    npx @stoplight/prism-cli mock docs/openapi.yaml -p 4010
    curl -H 'Authorization: Bearer test' 'http://localhost:4010/movies?page=1&size=2'
    ```

    동작을 확인했습니다 — 토큰 없이 호출하면 `401`, `page=abc`면 `422`,
    사유 없이 반려하면 `400`이 명세만으로 나옵니다.
    응답 예시는 지어내지 않고 실 DB 레코드를 그대로 넣었습니다.

    ## 아직 확정이 아닌 것

    | 항목 | 상태 |
    |---|---|
    | 영화 점수 | `movies.pop_talk_score`로 **생겼습니다**. 다만 admin이 보는 `popcorn_movies`에는 없습니다 |
    | `categories` | 테이블 없음. 초안은 `docs/category-domain-draft.sql` (미실행) |
    | `/members` 계열 7개 | 테이블은 생겼으나 **구조가 다름** — 실제는 `users.id`가 uuid, `role` 없음, `reviews.rating` |
    | 취향 갱신 배치 | 일정상 **이번 범위 아님**. `/members/{memberId}/preference-updates`도 함께 보류 |

servers:
  - url: https://api.poptalk.kr/admin/v1
    description: 운영
  - url: http://localhost:9000/admin/v1
    description: 로컬 — 직접 띄운 백엔드 (아키텍처 문서의 backend 포트 9000)
  - url: http://localhost:4010
    description: 목 서버 — npx @stoplight/prism-cli mock docs/openapi.yaml -p 4010

security:
  - bearerAuth: []

tags:
  - name: auth
    description: 로그인 · 토큰 갱신 · 로그아웃 (⚠️ 이번 개발 범위 아님)
  - name: movies
    description: 서비스 영화 · 인증완료 영화 · 영화 상세
  - name: movie-categories
    description: 카테고리 관리 (영화 분류)
  - name: display-categories
    description: 화면 문구 관리 (사용자 화면 알약 문구)
  - name: reviews
    description: 감상평 관리
  - name: members
    description: 회원 관리 · 회원 상세
  - name: admins
    description: 관리자 관리 (⚠️ 이번 개발 범위 아님)
  - name: push
    description: 푸시 발송 및 이력 (⚠️ 이번 개발 범위 아님)
  - name: logs
    description: 검증 로그 (⚠️ 이번 개발 범위 아님)
  - name: batches
    description: 배치 실행 현황
  - name: dashboard
    description: 대시보드 집계
  - name: ops
    description: 운영 — 로드밸런서 헬스체크

paths:
  # ────────────────────────────────────────────────────────────────
  # 인증
  # ────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: 로그인
      description: |
        **이 엔드포인트만 인증이 필요 없습니다.**

        액세스 토큰은 짧게(15분), 리프레시 토큰은 길게(14일) 둡니다.
        리프레시 토큰은 **httpOnly·Secure·SameSite=Strict 쿠키**로 내려 XSS로 탈취되지
        않게 합니다. 액세스 토큰만 본문으로 주고 클라이언트가 메모리에 듭니다.

        정지된 계정(`status=SUSPENDED`)은 403입니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
            example: { email: kimwoon@popcorn.kr, password: '********' }
      responses:
        '200':
          description: 성공. 리프레시 토큰은 Set-Cookie로 내려갑니다
          headers:
            Set-Cookie:
              description: '`refresh_token=…; HttpOnly; Secure; SameSite=Strict; Max-Age=1209600`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                token_type: Bearer
                expires_in: 900
                admin:
                  id: 1
                  name: 김운영
                  email: kimwoon@popcorn.kr
                  role: SUPER_ADMIN
                  status: ACTIVE
                  joined_at: '2025-12-01 09:00:00'
        '401':
          description: 이메일 또는 비밀번호 불일치
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: 'https://api.poptalk.kr/problems/invalid-credentials'
                title: 로그인에 실패했습니다
                status: 401
                detail: 이메일 또는 비밀번호를 확인해주세요.
        '403':
          description: 정지된 계정
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: 액세스 토큰 갱신
      description: |
        쿠키의 리프레시 토큰으로 새 액세스 토큰을 받습니다. 본문은 없습니다.
        갱신할 때 리프레시 토큰도 새로 발급(rotation)해 재사용 공격을 막습니다.
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '401':
          description: 리프레시 토큰이 없거나 만료됨. 다시 로그인해야 합니다
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: 로그아웃
      description: 리프레시 토큰을 무효화하고 쿠키를 지웁니다. GNB 우측 버튼이 호출합니다.
      responses:
        '204': { description: 로그아웃됨 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────
  # 영화
  # ────────────────────────────────────────────────────────────────
  /movies:
    get:
      operationId: listMovies
      tags: [movies]
      summary: 영화 목록
      description: |
        서비스 영화 화면과 인증완료 영화 화면이 같은 엔드포인트를 씁니다.
        인증완료 화면은 `approval_status=APPROVED`를 붙여 호출합니다.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: approval_status
          in: query
          description: 여러 개면 콤마로 구분
          schema: { type: string, example: 'PENDING,APPROVED' }
        - name: service_status
          in: query
          schema: { $ref: '#/components/schemas/MovieServiceStatus' }
        - name: genre
          in: query
          description: 장르 정확 일치. `genres` 배열에 포함되면 매칭
          schema: { type: string, example: 드라마 }
        - name: q
          in: query
          description: 제목·감독·배우 부분 일치
          schema: { type: string }
        - name: synced_from
          in: query
          description: 수집일시 시작
          schema: { type: string, format: date }
        - name: synced_to
          in: query
          schema: { type: string, format: date }
        - name: approved_from
          in: query
          description: 인증일시 시작. 인증완료 화면의 기간 필터
          schema: { type: string, format: date }
        - name: approved_to
          in: query
          schema: { type: string, format: date }
        - name: sort
          in: query
          schema:
            type: string
            default: release_date:desc
            enum: [release_date:desc, release_date:asc, created_at:desc, pop_talk_score:desc]
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items, summary]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Movie' }
                      summary:
                        $ref: '#/components/schemas/MovieSummary'
              example:
                page: 1
                size: 10
                total: 5985
                total_pages: 599
                items:
                  - id: 1
                    kofic_movie_cd: '20254904'
                    kmdb_id: K41667
                    kmdb_matched: true
                    title_ko: 가능한 사랑
                    title_en: Possible Love
                    release_date: '2025-09-23'
                    production_year: 2025
                    runtime_minutes: 164
                    production_status: 개봉예정
                    production_countries: [한국]
                    representative_country: 한국
                    genres: [드라마]
                    directors: [이창동]
                    actors: [전도연, 설경구, 조인성, 조여정]
                    viewing_grade: 청소년관람불가
                    poster_url: 'http://file.koreafilm.or.kr/thm/02/99/19/51/tn_DPK026223.jpg'
                    service_status: PUBLISHED
                    approval_status: APPROVED
                    approved_by: initial-dataset
                    approved_at: '2026-08-07 10:46:13'
                    source_system: KOFIC_KMDB
                    source_hash: 9f2c1a7e4b83d05c6e1f8a37b2d94c05e7a13f6b8c2d94e05a7f1c3b6d82e940
                    source_synced_at: '2026-08-07 10:46:13'
                    created_at: '2026-08-07 10:46:13'
                    updated_at: '2026-08-07 10:46:13'
                    is_embedded: false
                    media:
                      - { type: POSTER, url: 'http://file.koreafilm.or.kr/thm/02/99/19/51/tn_DPK026223.jpg', order: 0, primary: true }
                      - { type: STILL, url: 'http://file.koreafilm.or.kr/thm/01/copy/00/78/48/tn_DST953024.jpg', order: 0, primary: false }
                    pop_talk_score: null
                    categories: []
                summary: { total: 5985, published: 5985, pending: 0, approved: 5985, rejected: 0 }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /movies/{movieId}:
    parameters:
      - { $ref: '#/components/parameters/MovieId' }
    get:
      operationId: getMovies
      tags: [movies]
      summary: 영화 상세
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovieDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      operationId: updateMovies
      tags: [movies]
      summary: 영화 정보 수정
      description: |
        보낸 필드만 바뀝니다. 변경 사실은 `VerificationLog`에 `EDIT`으로 남습니다.
        `note`는 로그에 남길 사유이고 영화 데이터에는 저장되지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                pop_talk_score: { type: number, minimum: 0, maximum: 100 }
                plot: { type: string }
                category_ids:
                  type: array
                  items: { type: integer, format: int64 }
                note: { type: string, description: 검증 로그에 남길 사유 }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovieDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /movies/{movieId}/approval:
    parameters:
      - { $ref: '#/components/parameters/MovieId' }
    put:
      operationId: setMoviesApproval
      tags: [movies]
      summary: 인증 상태 변경 (인증 / 반려 / 재검토 복귀)
      description: |
        **인증(`APPROVED`)은 사용자 화면에 인증 뱃지를 다는 신호입니다.**
        단순 내부 승인이 아니라 "관리자가 확인한 영화"라는 표시입니다.

        **반려(`REJECTED`)에는 사유가 필수입니다.** DB에 CHECK 제약이 걸려 있어
        사유 없이 보내면 400입니다.

        ```sql
        CONSTRAINT ck_popcorn_movies_rejection CHECK (
          approval_status <> 'REJECTED'
          OR (rejection_reason IS NOT NULL AND btrim(rejection_reason) <> '')
        )
        ```

        **반려는 노출도 함께 중단합니다**(`service_status = HIDDEN`).
        서비스에서 내리는 조치이기 때문입니다.
        인증·재검토 복귀는 `service_status`를 건드리지 않습니다 — 두 축은 별개입니다.

        `approved_by`는 서버가 토큰에서 읽어 채웁니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/MovieApprovalStatus' }
                reason:
                  type: string
                  minLength: 1
                  description: '`status=REJECTED`일 때 필수'
            examples:
              승인:
                value: { status: APPROVED }
              반려:
                value: { status: REJECTED, reason: 저작권 확인 필요 }
              재검토복귀:
                value: { status: PENDING }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovieDetail' }
        '400':
          description: 반려 사유 누락 등
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: 'https://api.poptalk.kr/problems/validation-error'
                title: 반려 사유가 필요합니다
                status: 400
                detail: status가 REJECTED이면 reason은 비워둘 수 없습니다.
        '404': { $ref: '#/components/responses/NotFound' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /movies/{movieId}/service-status:
    parameters:
      - { $ref: '#/components/parameters/MovieId' }
    put:
      operationId: setMoviesServiceStatus
      tags: [movies]
      summary: 노출 상태 변경 (⚠️ 이번 개발 범위 아님)
      description: |
        **이번 개발 범위가 아닙니다.** admin 목록에서 노출을 켜고 끄는 길은
        제거했고, 상태 표시만 남겼습니다. 설계는 그대로 둡니다.

        **인증 상태와 무관하게 바꿀 수 있습니다.** 수집된 영화면 인증대기든
        인증완료든 노출을 켜고 끌 수 있습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/MovieServiceStatus' }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovieDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /movies/{movieId}/embedding:
    parameters:
      - { $ref: '#/components/parameters/MovieId' }
    post:
      operationId: createMoviesEmbedding
      tags: [movies]
      summary: 추천 임베딩 재생성 요청
      description: |
        `movie_embedding_jobs`에 `UPSERT` 작업을 넣습니다.
        이미 대기·처리 중인 작업이 있으면 새로 만들지 않고 그것을 반환합니다
        (`uq_movie_embedding_jobs_active` 유니크 인덱스).

        **임베딩은 `service_status=PUBLISHED`이고 `approval_status=APPROVED`일 때만
        생성됩니다.** 다른 상태면 기존 임베딩을 `STALE`로 바꾸고 큐에 넣지 않습니다.
      responses:
        '202':
          description: 큐에 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmbeddingJob' }
        '409':
          description: 노출·인증 상태가 임베딩 조건에 맞지 않음
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # ────────────────────────────────────────────────────────────────
  # 카테고리
  # ────────────────────────────────────────────────────────────────
  /movie-categories:
    get:
      operationId: listMovieCategories
