      summary: 카테고리 삭제
      description: 영화에 연결된 카테고리는 지울 수 없습니다.
      responses:
        '204': { description: 삭제됨 }
        '409':
          description: 연결된 영화가 있음
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /display-categories:
    get:
      operationId: listDisplayCategories
      tags: [display-categories]
      summary: 화면 문구 목록
      description: 사용자 화면에 노출되는 추천 알약 문구입니다.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
