          schema: { $ref: '#/components/schemas/MovieCategoryType' }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/MovieCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createMovieCategories
      tags: [movie-categories]
      summary: 카테고리 추가
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovieCategoryInput' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovieCategory' }
        '409':
          description: code 중복
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /movie-categories/{categoryId}:
    parameters:
      - { $ref: '#/components/parameters/CategoryId' }
    patch:
      operationId: updateMovieCategories
      tags: [movie-categories]
      summary: 카테고리 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MovieCategoryInput'
